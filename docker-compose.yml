services:
        agate:
                image: obiba/agate:${tag:-snapshot}
                build: .
                ports:
                        - "8881:8081"
                depends_on:
                        mongo:
                                condition: service_healthy
                environment:
                        - AGATE_ADMINISTRATOR_PASSWORD=${AGATE_ADMINISTRATOR_PASSWORD}
                        - MONGO_HOST=mongo
                        - MONGO_PORT=27017
                        - MONGO_USER=${MONGO_USER:-obiba}
                        - MONGO_PASSWORD=${MONGO_PASSWORD:-password}
                        - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY}
                        - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
                volumes:
                        - ${AGATE_DIR}:/srv
        mongo:
                image: mongo:8.0
                environment:
                        - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-obiba}
                        - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-password}
                healthcheck:
                        test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/admin --quiet -u ${MONGO_USER:-obiba} -p ${MONGO_PASSWORD:-password} --authenticationDatabase admin
                        interval: 5s
                        timeout: 5s
                        retries: 20
                        start_period: 30s
